name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRECISIGN_DATABASE: sqlite
      PRECISIGN_EMAIL_MODE: disabled
      VITE_DATA_MODE: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Run the domain and repository baseline
        run: node --import tsx --test shared/utils/approvalJourney.test.ts shared/utils/workflowEngine.test.ts frontend/src/services/repository.test.ts shared/utils/companyAccess.test.ts
      - run: npm run test:startup
      - run: npm run build
      - name: Check the Hostinger entry point
        run: node --check hostinger.cjs
